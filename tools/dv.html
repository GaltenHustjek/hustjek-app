<head>

<meta name="robots" content="noindex,nofollow">
<title>Galten Hustjek – Drift og vedligehold</title>
<meta name="theme-color" content="#123a5e">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<style id="wrapcss">
:root{--bg:#f1f5f9;--card:#fff;--ink:#22282e;--muted:#5b6672;--line:#c9d6e3;--accent:#2b87d3;--red:#b42323}
@media (prefers-color-scheme: dark){:root{--bg:#0e1620;--card:#16212d;--ink:#e7edf3;--muted:#9aa8b7;--line:#33475b;--accent:#4aa3ec;--red:#ff9d9d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(400px,100%);display:grid;gap:12px;box-shadow:0 4px 18px rgba(18,58,94,.1)}
.logo{background:#fff;border-radius:10px;padding:8px;text-align:center}.logo img{height:56px}
h1{font-size:20px;margin:4px 0 0}
p{margin:0;color:var(--muted);font-size:14.5px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit}
label{display:flex;gap:8px;align-items:center;font-size:14.5px}
button{font:inherit;font-weight:700;padding:11px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--red);font-weight:600;font-size:14.5px;min-height:1.2em}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="box" id="lock" hidden autocomplete="on">
  <div class="logo"><img src="../icons/logo.png" alt="Galten Hustjek"></div>
  <h1>Galten Hustjek</h1>
  <p>Appen er låst. Skriv adgangskoden for at åbne den.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Adgangskode" required>
  <label><input type="checkbox" id="rem" checked> Husk på denne enhed (så virker den også offline)</label>
  <button id="go">Lås op</button>
  <div class="err" id="err" role="alert"></div>
</form>

  var KEY='gh-unlock-key';
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function b64e(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
  if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('../sw.js').catch(function(){})}
  function show(){document.getElementById('lock').hidden=false;setTimeout(function(){document.getElementById('pw').focus()},50)}
  if(!window.crypto||!crypto.subtle){show();document.getElementById('err').textContent='Browseren kan ikke åbne appen her. Brug Chrome via https-adressen.';document.getElementById('go').disabled=true;return}
  function mount(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var scripts=Array.prototype.slice.call(doc.querySelectorAll('script'));
    scripts.forEach(function(s){s.parentNode.removeChild(s)});
    ['lock','wrapcss'].forEach(function(id){var e=document.getElementById(id);if(e)e.remove()});
    Array.prototype.slice.call(document.querySelectorAll('noscript')).forEach(function(e){e.remove()});
    if(doc.title)document.title=doc.title;
    Array.prototype.slice.call(doc.head.childNodes).forEach(function(n){
      if(n.nodeType===1&&n.tagName==='META'&&(n.getAttribute('charset')||n.getAttribute('name')==='viewport'))return;
      if(n.nodeType===1&&n.tagName==='TITLE')return;
      document.head.appendChild(document.importNode(n,true))});
    Array.prototype.slice.call(doc.body.childNodes).forEach(function(n){document.body.appendChild(document.importNode(n,true))});
    var i=0;
    (function next(){
      if(i>=scripts.length)return;
      var o=scripts[i++],s=document.createElement('script');
      Array.prototype.slice.call(o.attributes).forEach(function(a){s.setAttribute(a.name,a.value)});
      if(o.src){s.onload=next;s.onerror=next;document.body.appendChild(s)}
      else{s.textContent=o.textContent;document.body.appendChild(s);next()}
    })();
  }
  function openWith(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct)).then(function(pt){mount(new TextDecoder().decode(pt))})}
  function stored(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  var k=stored();
  if(k){crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']).then(openWith).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}show()})}
  else show();
  document.getElementById('lock').addEventListener('submit',function(e){
    e.preventDefault();var btn=document.getElementById('go'),err=document.getElementById('err');
    btn.disabled=true;btn.textContent='Åbner…';err.textContent='';
    var pw=document.getElementById('pw').value;
    crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
      .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])})

      .catch(function(){btn.disabled=false;btn.textContent='Lås op';err.textContent='Forkert adgangskode. Prøv igen.'});
